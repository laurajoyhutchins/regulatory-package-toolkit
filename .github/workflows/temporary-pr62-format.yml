name: PR62 temporary style diff
on:
  push:
    branches: [feat/versioned-remote-package-review]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.13.2
      - run: ruff format --diff tests/test_review_workflow.py
